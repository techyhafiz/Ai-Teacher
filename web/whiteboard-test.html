<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whiteboard Renderer Test Bench</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0e0b09; color: #eee; padding: 16px; }
  h1 { font-size: 18px; color: #e8a33d; margin-bottom: 12px; }
  .board-col { position: relative; width: 1000px; height: 620px; max-width: 96vw; }
  #whiteboard { display: block; border-radius: 10px; }
  .board-overlay { position: absolute; inset: 0; pointer-events: none; }
  .btns { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: #35271e; color: #f5ede2; border: 1px solid #523e30; padding: 8px 12px;
           border-radius: 8px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: #e8a33d; }
  #log { font-family: monospace; font-size: 12px; white-space: pre-wrap; color: #9fd; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Whiteboard Renderer Test Bench — draw_concept_card / draw_map / show_image</h1>

  <div class="board-col">
    <canvas id="whiteboard"></canvas>
    <div id="board-overlay" class="board-overlay"></div>
  </div>

  <div class="btns">
    <button onclick="T.card()">draw_concept_card</button>
    <button onclick="T.map()">draw_map (india)</button>
    <button onclick="T.globe()">draw_map (world)</button>
    <button onclick="T.image()">show_image</button>
    <button onclick="Whiteboard.redraw()">redraw()</button>
    <button onclick="T.reset()">clear()</button>
    <button onclick="T.suite().then(r=>log(JSON.stringify(r,null,2)))">▶ Run full auto-suite</button>
  </div>
  <div id="log"></div>

  <script src="js/whiteboard.js"></script>
  <script>
    'use strict';
    // ---- error capture (so the auto-suite can report crashes) --------------
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(String(e.message || e)));
    window.addEventListener('unhandledrejection', (e) =>
      window.__errors.push('reject: ' + String(e.reason && e.reason.message || e.reason || e)));

    const canvas = document.getElementById('whiteboard');
    Whiteboard.init(canvas);

    function log(s) { document.getElementById('log').textContent = s; }

    // Sum a downsampled grid of canvas pixels → a cheap "did the board change?" signal.
    function pixelSum() {
      const c = canvas.getContext('2d');
      let img;
      try { img = c.getImageData(0, 0, canvas.width, canvas.height); }
      catch (e) { return { tainted: true, err: String(e) }; }
      const d = img.data;
      let sum = 0, n = 0;
      const step = 4 * 137;            // prime stride → broad coverage, small cost
      for (let i = 0; i < d.length; i += step) { sum += d[i] + d[i+1] + d[i+2]; n++; }
      return sum;
    }

    // A small raster PNG data-URL (never taints the canvas, no network needed).
    function makePngDataUrl() {
      const oc = document.createElement('canvas');
      oc.width = 240; oc.height = 160;
      const g = oc.getContext('2d');
      g.fillStyle = '#1e3a5f'; g.fillRect(0, 0, 240, 160);
      g.fillStyle = '#fde047'; g.beginPath(); g.arc(120, 80, 50, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#f472b6'; g.fillRect(20, 20, 60, 40);
      return oc.toDataURL('image/png');
    }

    const CARD = { title: 'Photosynthesis', chalk: 'yellow',
      points: ['Sunlight + CO₂ + H₂O are the inputs',
               'Chlorophyll in chloroplasts captures light',
               'Light energy → chemical energy (glucose)',
               'Oxygen is released as a by-product'] };
    const MAP_INDIA = { title: 'Major Rivers of India', region: 'india', chalk: 'blue',
      markers: [{ x: 55, y: 32, label: 'Ganga' }, { x: 50, y: 60, label: 'Godavari' },
                { x: 36, y: 46, label: 'Narmada' }, { x: 60, y: 78, label: 'Kaveri' }] };
    const MAP_WORLD = { title: 'Continents', region: 'world', chalk: 'green',
      points: [{ x: 30, y: 45, label: 'Americas' }, { x: 55, y: 40, label: 'Africa' },
               { x: 70, y: 35, label: 'Asia' }] };

    const T = {
      reset() { Whiteboard.clear(); return pixelSum(); },
      card()  { Whiteboard.execute('draw_concept_card', CARD); return pixelSum(); },
      map()   { Whiteboard.execute('draw_map', MAP_INDIA); return pixelSum(); },
      globe() { Whiteboard.execute('draw_map', MAP_WORLD); return pixelSum(); },
      image() {
        const url = makePngDataUrl();
        Whiteboard.execute('draw_concept_card', { ...CARD, title: 'Slide underneath' });
        Whiteboard.execute('show_image', { url, caption: 'Generated slide (Nano Banana)' });
        return pixelSum();
      },
      // Full automated suite — resolves to a JSON verdict object.
      async suite() {
        window.__errors = [];
        const out = { steps: {}, errors: null, verdict: 'PENDING' };
        const blank = T.reset();
        out.steps.blank = blank;

        const card = T.card();
        out.steps.concept_card = { sum: card, changed: card !== blank };

        const map = T.map();
        out.steps.map_india = { sum: map, changed: map !== card };

        const globe = T.globe();
        out.steps.map_world = { sum: globe, changed: globe !== map };

        // redraw determinism: replay ops twice, sums must match & be non-blank
        const r1 = (Whiteboard.redraw(), pixelSum());
        const r2 = (Whiteboard.redraw(), pixelSum());
        out.steps.redraw = { r1, r2, stable: r1 === r2, nonBlank: r1 !== blank };

        // resize survival: shrink parent, resize+redraw, must still render non-blank
        const col = document.querySelector('.board-col');
        col.style.width = '640px'; col.style.height = '400px';
        Whiteboard.resize(); Whiteboard.redraw();
        const resized = pixelSum();
        out.steps.resize = { sum: resized, nonBlank: resized !== blank && !resized.tainted };
        col.style.width = '1000px'; col.style.height = '620px';
        Whiteboard.resize(); Whiteboard.redraw();

        // show_image: async load a PNG data-URL, then confirm it draws over the board
        const url = makePngDataUrl();
        T.reset();
        Whiteboard.execute('draw_concept_card', { ...CARD, title: 'Underneath' });
        const beforeImg = pixelSum();
        Whiteboard.execute('show_image', { url, caption: 'Slide' });
        await new Promise(res => setTimeout(res, 500));   // let img.onload → redraw fire
        const afterImg = pixelSum();
        // redraw again: image must persist from cache (no re-fetch, no flicker to blank)
        Whiteboard.redraw();
        await new Promise(res => setTimeout(res, 60));
        const afterRedraw = pixelSum();
        out.steps.show_image = {
          before: beforeImg, after: afterImg, afterRedraw,
          drewOnLoad: afterImg !== beforeImg && !afterImg.tainted,
          persistsOnRedraw: afterRedraw !== beforeImg && !afterRedraw.tainted,
        };

        out.errors = window.__errors.slice();
        const s = out.steps;
        out.verdict = (s.concept_card.changed && s.map_india.changed && s.map_world.changed &&
          s.redraw.stable && s.redraw.nonBlank && s.resize.nonBlank &&
          s.show_image.drewOnLoad && s.show_image.persistsOnRedraw &&
          out.errors.length === 0) ? 'PASS' : 'FAIL';
        return out;
      },
    };
    window.T = T;
    // draw something by default so a screenshot is meaningful
    T.card();
  </script>
</body>
</html>
